<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#737373">
<title>Lebenslauf Roger Avdiyskiy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--band:#737373;--band-dark:#5e5e5e;--paper:#ececec;--bar-h:60px}
*{box-sizing:border-box;margin:0}
html{background:var(--band)}
body{background:var(--paper);font:500 1rem/1.5 Poppins,system-ui,sans-serif;height:100svh;display:flex;flex-direction:column;overflow:hidden}
.bar{flex:none;display:flex;gap:8px;align-items:center;justify-content:space-between;min-height:var(--bar-h);padding:calc(8px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));background:var(--band)}
.bar a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:6px;color:#fff;text-decoration:none}
.bar a.dl{background:#fff;color:var(--band-dark);font-weight:600}
.bar a:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (hover:hover){.bar a:hover{text-decoration:underline;text-underline-offset:3px}}
/* ganze A4-Seite passt immer in den sichtbaren Bereich; Details per Zoom-Geste */
.sheet{flex:1;min-height:0;min-width:0;padding:12px}
.sheet img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 1px 3px rgba(0,0,0,.25))}
</style>
</head>
<body>
<nav class="bar">
  <a href="./">Zurück</a>
  <a class="dl" href="Lebenslauf_Roger_Avdiyskiy.pdf" download>Als PDF herunterladen</a>
</nav>
<main class="sheet">
  <img src="lebenslauf.jpg" width="1654" height="2339" alt="Lebenslauf von Roger Avdiyskiy: Schullaufbahn HTBLVA Spengergasse (Wirtschaftsingenieure - Betriebsinformatik, seit 2024) und BRG6 Marchettigasse; Ferialpraktikum bei Salesianer Miettex 07/2026; Cloudflight Coding Contest CCC 42; Debian-Homelab; Kenntnisse JavaScript, SQL, Linux, Git, Autodesk Inventor; Sprachen Deutsch, Russisch, Englisch B2.">
</main>
</body>
</html>
